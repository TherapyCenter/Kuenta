<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KuentaPOS</title>
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="menubar">
    <div class="brand" title="KuentaPOS – Invoicing &amp; POS for auto repair shops"><img src="img/icon.svg" alt=""><span>KuentaPOS</span></div>
    <nav id="menus"></nav>
    <div class="global-search"><input id="gsearch" type="search" placeholder="Suche: Kunde, Kennzeichen, Rechnungs-Nr. …" autocomplete="off"><div id="gsearch-res" class="popup hidden"></div></div>
    <div id="userbox"></div>
  </header>
  <div id="quickbar"></div>
  <div id="body">
    <aside id="nav"></aside>
    <main id="main"></main>
  </div>
  <footer id="statusbar"><span id="status-left"></span><span id="status-right"></span></footer>
</div>
<div id="windows"></div>
<div id="toasts"></div>
<script src="js/i18n.js"></script>

<script src="js/views-nl.js"></script>
<script src="js/views-be.js"></script>
<script src="js/views-lu.js"></script>
